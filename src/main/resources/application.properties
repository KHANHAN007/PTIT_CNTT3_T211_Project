spring.application.name=BankRestApi
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rikkei_bank?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:rikkei}
spring.datasource.password=${DB_PASSWORD:rikkei_secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
server.forward-headers-strategy=framework

app.jwt.secret=${JWT_SECRET:RikkeiBankDevelopmentSecretKeyMustBeAtLeast256BitsLong}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:300000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:86400000}
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.base-url=${STORAGE_BASE_URL:http://localhost:8080/uploads}
app.storage.local-dir=${STORAGE_LOCAL_DIR:uploads}
app.storage.cloudinary-cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.storage.cloudinary-upload-preset=${CLOUDINARY_UPLOAD_PRESET:}
app.security.login-max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.lock-duration-seconds=${LOCK_DURATION_SECONDS:900}
app.security.otp-expiration-seconds=${OTP_EXPIRATION_SECONDS:300}
app.security.password-reset-expiration-seconds=${PASSWORD_RESET_EXPIRATION_SECONDS:900}
app.transfer.single-limit=${TRANSFER_SINGLE_LIMIT:100000000}
app.transfer.daily-limit=${TRANSFER_DAILY_LIMIT:500000000}
app.transfer.approval-threshold=${TRANSFER_APPROVAL_THRESHOLD:50000000}
app.encryption.key=${ENCRYPTION_KEY:RikkeiBankEncryptionKeyForLocalDevelopmentOnly}
app.seed.admin-password=${ADMIN_SEED_PASSWORD:Admin@123456}
app.seed.staff-password=${STAFF_SEED_PASSWORD:Staff@123456}
app.reconciliation.cron=${RECONCILIATION_CRON:0 0 2 * * *}
app.interbank.retry-delay-ms=${INTERBANK_RETRY_DELAY_MS:60000}
