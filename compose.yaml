services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rikkei_bank
      MYSQL_USER: rikkei
      MYSQL_PASSWORD: rikkei_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/rikkei_bank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: rikkei
      DB_PASSWORD: rikkei_secret
      SPRING_FLYWAY_USER: rikkei
      SPRING_FLYWAY_PASSWORD: rikkei_secret
      REDIS_HOST: redis
      MAIL_HOST: mailhog
      FLYWAY_ENABLED: "true"
      DDL_AUTO: validate
      JWT_SECRET: RikkeiBankDockerSecretKeyMustBeAtLeast256BitsLong
      ENCRYPTION_KEY: RikkeiBankDockerEncryptionKeyChangeInProduction
      STORAGE_BASE_URL: http://localhost:8081/uploads
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mysql_data:
  redis_data:
  grafana_data:
